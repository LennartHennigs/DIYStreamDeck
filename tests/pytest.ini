[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    slow: marks tests as slow running
    security: marks tests as security focused
    mac_only: marks tests that only run on macOS
    pico_only: marks tests specific to Pi Pico functionality

# Default options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --color=yes

# Minimum version
minversion = 7.0

# Ignore certain files/directories
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    .venv
    venv

# Logging
log_cli = true
log_cli_level = INFO

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning